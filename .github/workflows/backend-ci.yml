name: Backend CI

on:
  push:
    branches: [main]
    paths: ["washnpress-v2/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["washnpress-v2/**"]

defaults:
  run:
    working-directory: washnpress-v2

jobs:
  quality:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: washnpress-v2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Build image, smoke test, push
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t washnpress-backend:ci .
      - name: Start container
        run: docker run -d --name wnp -p 8080:8080 washnpress-backend:ci
      - name: Smoke test the running container
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
          chmod +x scripts/smoke-test.sh
          BASE_URL=http://localhost:8080 ./scripts/smoke-test.sh
      - name: Container logs on failure
        if: failure()
        run: docker logs wnp || true
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push image
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/washnpress-backend
          docker tag washnpress-backend:ci $IMAGE:latest
          docker tag washnpress-backend:ci $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
