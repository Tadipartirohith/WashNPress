name: Web CI

on:
  push:
    branches: [main]
    paths: ["washnpress-web/**", ".github/workflows/web-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["washnpress-web/**"]

defaults:
  run:
    working-directory: washnpress-web

jobs:
  build:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: washnpress-web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Build web container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -t washnpress-web:ci .
