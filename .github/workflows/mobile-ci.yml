name: Mobile CI

on:
  push:
    branches: [main]
    paths: ["washnpress-mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["washnpress-mobile/**"]

defaults:
  run:
    working-directory: washnpress-mobile

jobs:
  typecheck:
    name: Type check and test the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # The whole app, not only the framework-free files. It has typechecked in
      # full since the portals were brought in line with the API types.
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
