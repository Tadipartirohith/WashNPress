name: Mobile CI

on:
  push:
    branches: [main]
    paths: ["washnpress-mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["washnpress-mobile/**"]

defaults:
  run:
    working-directory: washnpress-mobile

jobs:
  typecheck:
    name: Type check, verify tokens, and test the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # The whole app, not only the framework-free files. It has typechecked in
      # full since the portals were brought in line with the API types.
      - run: npx tsc --noEmit -p tsconfig.json
      # The same order as `npm run verify` locally: contrast (both light and dark —
      # the gate that caught the teal restyle carrying white text below AA), the
      # inlined-env-var check, and the modal/pressable-ancestor check, all before
      # the test suite.
      - run: npm run verify:contrast
      - run: npm run verify:env
      - run: npm run verify:modal
      - run: npm test
      # Compiles a real production bundle and reads it. Everything above this line
      # checks what was written; this checks what would ship. The demo logins that
      # made anyone who installed the staff app an administrator were invisible to
      # every other gate, because tests run the source and not the bundle.
      - run: npm run verify:release
